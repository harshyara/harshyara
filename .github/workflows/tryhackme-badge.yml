name: TryHackMe Update Badge

on:
  schedule:
    - cron: "0 19 * * *"   # every day, 12:30 AM India time
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

env:
  BADGE_URL: "https://tryhackme.com/badge/t/4b7bc90f47101dd73c00fad6e83db01b47ce6894dff3bcb2a790adfc7fc358bf75d06661b43d52d28ccad52e4a33f4b4?theme=dark"

jobs:
  tryhackme-badge-update:
    name: Take a picture of the TryHackMe badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install a headless browser
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Render the badge and save it as an image
        run: |
          mkdir -p assets
          cat > snap.mjs <<'JS'
          import { chromium } from "playwright";
          const url = process.env.BADGE_URL;
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1000, height: 600 }, deviceScaleFactor: 2 });
          await page.setContent(`<!doctype html><html><head><meta charset="utf-8">
            <style>html,body{margin:0;padding:0;background:transparent}#wrap{display:inline-block;padding:0}</style></head>
            <body><div id="wrap"><script src="${url}"></script></div></body></html>`, { waitUntil: "networkidle" });
          await page.waitForTimeout(4000);
          const box = await page.evaluate(() => {
            let r = { l: Infinity, t: Infinity, rr: 0, b: 0 };
            document.querySelectorAll("#wrap *").forEach(el => {
              if (el.tagName === "SCRIPT" || el.tagName === "STYLE") return;
              const b = el.getBoundingClientRect();
              if (b.width < 2 || b.height < 2) return;
              r.l = Math.min(r.l, b.left); r.t = Math.min(r.t, b.top);
              r.rr = Math.max(r.rr, b.right); r.b = Math.max(r.b, b.bottom);
            });
            return r.rr ? { x: r.l, y: r.t, width: r.rr - r.l, height: r.b - r.t } : null;
          });
          if (!box) { console.error("The badge did not render. Check BADGE_URL."); process.exit(1); }
          await page.screenshot({ path: "assets/thm_badge.png", clip: box, omitBackground: true });
          console.log("Saved assets/thm_badge.png", box);
          await browser.close();
          JS
          node snap.mjs

      - name: Commit the new picture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/thm_badge.png
          git diff --cached --quiet && echo "Badge unchanged" || (git commit -m "Update TryHackMe badge" && git push)
