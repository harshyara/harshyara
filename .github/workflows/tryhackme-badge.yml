name: TryHackMe Update Badge
 
on:
  schedule:
    - cron: "0 19 * * *"   # every day, 12:30 AM India time
  workflow_dispatch:         # lets you run it by hand from the Actions tab
 
permissions:
  contents: write
 
jobs:
  tryhackme-badge-update:
    name: Update the TryHackMe badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: p4p1/tryhackme-badge-workflow@main
        with:
          username: "harshyara"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
