name: Profile stat cards

on:
  schedule:
    - cron: "30 18 * * *"   # every day, midnight India time
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Draw the streak card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          mkdir -p assets
          cat > streak.mjs <<'JS'
          const login = process.env.LOGIN, token = process.env.GH_TOKEN;
          async function gql(query, variables) {
            const r = await fetch("https://api.github.com/graphql", {
              method: "POST",
              headers: { Authorization: `bearer ${token}`, "Content-Type": "application/json" },
              body: JSON.stringify({ query, variables }),
            });
            const j = await r.json();
            if (j.errors) throw new Error(JSON.stringify(j.errors));
            return j.data;
          }
          const { user } = await gql(`query($l:String!){ user(login:$l){ createdAt } }`, { l: login });
          const start = new Date(user.createdAt), now = new Date();
          const days = new Map();
          for (let y = start.getUTCFullYear(); y <= now.getUTCFullYear(); y++) {
            const from = new Date(Math.max(Date.UTC(y, 0, 1), start.getTime())).toISOString();
            const to = new Date(Math.min(Date.UTC(y, 11, 31, 23, 59, 59), now.getTime())).toISOString();
            const d = await gql(`query($l:String!,$f:DateTime!,$t:DateTime!){ user(login:$l){ contributionsCollection(from:$f,to:$t){
              contributionCalendar{ weeks{ contributionDays{ date contributionCount } } } } } }`, { l: login, f: from, t: to });
            for (const w of d.user.contributionsCollection.contributionCalendar.weeks)
              for (const c of w.contributionDays) days.set(c.date, c.contributionCount);
          }
          const list = [...days.entries()].sort((a, b) => a[0].localeCompare(b[0]));
          const total = list.reduce((s, [, n]) => s + n, 0);
          let longest = { n: 0, s: null, e: null }, run = { n: 0, s: null };
          for (const [d, n] of list) {
            if (n > 0) { if (!run.n) run.s = d; run.n++; if (run.n > longest.n) longest = { n: run.n, s: run.s, e: d }; }
            else run = { n: 0, s: null };
          }
          // current streak: today may still be empty, so start from yesterday in that case
          let i = list.length - 1; if (i >= 0 && list[i][1] === 0) i--;
          let cur = { n: 0, s: null, e: i >= 0 ? list[i][0] : null };
          for (; i >= 0 && list[i][1] > 0; i--) { cur.n++; cur.s = list[i][0]; }
          const fmt = (d, yr = true) => d ? new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", ...(yr ? { year: "numeric" } : {}), timeZone: "UTC" }) : "";
          const thisYear = d => d && d.startsWith(String(now.getUTCFullYear()));
          const range = (s, e) => !s ? "No streak yet" : s === e ? fmt(s, !thisYear(s)) : `${fmt(s, !thisYear(s))} – ${fmt(e, !thisYear(e))}`;
          const first = list.find(([, n]) => n > 0);
          const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
          const ink = "#E6EDF3", soft = "#9198A1", pink = "#F0A2BF", line = "#30363D";
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="980" height="200" viewBox="0 0 980 200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
            <rect x="0.5" y="0.5" width="979" height="199" rx="8" fill="#0D1117" stroke="${line}"/>
            <line x1="327" y1="32" x2="327" y2="168" stroke="${line}"/><line x1="653" y1="32" x2="653" y2="168" stroke="${line}"/>
            <g text-anchor="middle">
              <text x="163" y="88" font-size="36" font-weight="700" fill="${ink}">${total.toLocaleString("en-US")}</text>
              <text x="163" y="122" font-size="16" fill="${ink}">Total Contributions</text>
              <text x="163" y="150" font-size="13" fill="${soft}">${esc(first ? fmt(first[0]) + " – Present" : "")}</text>
              <circle cx="490" cy="72" r="40" fill="none" stroke="${pink}" stroke-width="5"/>
              <path d="M490 20 c6 6 9 12 4 18 c4 -1 6 -4 6 -7 c4 5 4 12 -1 16 c-5 4 -13 3 -16 -3 c-3 -6 1 -11 5 -15 c-1 4 0 6 2 7 c-2 -6 -2 -11 0 -16z" fill="${pink}" stroke="#0D1117" stroke-width="3" paint-order="stroke"/>
              <text x="490" y="84" font-size="34" font-weight="700" fill="${ink}">${cur.n}</text>
              <text x="490" y="140" font-size="17" font-weight="700" fill="${pink}">Current Streak</text>
              <text x="490" y="166" font-size="13" fill="${soft}">${esc(range(cur.s, cur.e))}</text>
              <text x="816" y="88" font-size="36" font-weight="700" fill="${ink}">${longest.n}</text>
              <text x="816" y="122" font-size="16" fill="${ink}">Longest Streak</text>
              <text x="816" y="150" font-size="13" fill="${soft}">${esc(range(longest.s, longest.e))}</text>
            </g></svg>`;
          (await import("fs")).writeFileSync("assets/streak.svg", svg);
          console.log({ total, current: cur, longest });
          JS
          node streak.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet && echo "Streak card unchanged" || (git commit -m "Update streak card" && git push)

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}name: Profile stat cards

